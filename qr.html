<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation QR Code</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: Inter, sans-serif; background: #f6f1e7; color: #2f3a35; min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box; }
  body > div { max-width: 420px; margin: 0 auto; }
  .controls { margin-bottom: 28px; }
  .controls label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; }
  .controls input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; margin: 8px 0 12px; }
  .controls button { padding: 12px 22px; background: #56705c; color: #fff; border: 0; border-radius: 999px; font: 500 12px Inter; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; margin-right: 8px; }
  .card { background: #fffdf8; padding: clamp(20px, 6vw, 40px); text-align: center; border: 1px solid rgba(47,58,53,.14); }
  .card h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 34px; margin: 0 0 4px; }
  .card p { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; margin: 0 0 24px; color: #5d6a63; }
  #qr { display: inline-block; padding: 12px; background: #fff; }
  .card small { display: block; margin-top: 18px; font-size: 12px; color: #5d6a63; word-break: break-all; }
  @media print { .controls { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<div>
  <div class="controls">
    <label for="url">Wedding site URL</label>
    <input id="url" type="url">
    <button id="dl">Download PNG</button><button onclick="print()">Print</button>
  </div>
  <div class="card">
    <h1>Mason &amp; Skylar</h1>
    <p style="margin-bottom:6px">Scan for details &amp; RSVP</p>
    <p>May 2 – 4, 2027 · Carmel-by-the-Sea</p>
    <div id="qr"></div>
    <small id="url-text"></small>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const input = document.getElementById('url');
  input.value = location.protocol.startsWith('http') ? location.origin + '/' : 'https://your-wedding-site.vercel.app/';
  function render() {
    const box = document.getElementById('qr'); box.innerHTML = '';
    new QRCode(box, { text: input.value, width: 480, height: 480, colorDark: '#2f3a35', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
    box.style.width = '240px'; box.querySelectorAll('canvas,img').forEach(n => { n.style.width = '240px'; n.style.height = '240px'; });
    document.getElementById('url-text').textContent = input.value;
  }
  input.addEventListener('input', render); render();
  document.getElementById('dl').onclick = () => {
    const a = document.createElement('a');
    a.href = document.querySelector('#qr canvas').toDataURL('image/png');
    a.download = 'wedding-qr.png'; a.click();
  };
</script>
</body>
</html>
